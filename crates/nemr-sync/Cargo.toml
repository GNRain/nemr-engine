# The commercial sync server (WP-J): identity, session index, bundle
# upload/download through the M12 storage trait, and the D-03 lease. COMMERCIAL
# side of E-11 — `nemr-engine` must NOT depend on this (scripts/check_seam.sh).
#
# It depends on nemr-storage (M12) but NOT on nemr-crypto: the server stores the
# envelopes and ciphertext the client produces as opaque blobs and cannot open
# them. That the crypto crate is absent from this dependency graph is the
# structural statement that the server holds nothing it can read.
[package]
name = "nemr-sync"
version = "0.1.0"
edition = "2021"
description = "Nemr sync server — identity, index, storage, lease (WP-J)"
publish = false

[lib]
name = "nemr_sync"
path = "src/lib.rs"

[[bin]]
name = "nemr-sync"
path = "src/main.rs"

[dependencies]
nemr-storage = { path = "../nemr-storage", version = "0.1.0" }

axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower = "0.5"
# An object-safe façade over nemr-storage's ObjectStore (which uses native
# async-fn-in-trait and so is not dyn-compatible), so the backend can be chosen
# at runtime from config without threading a generic through every handler.
async-trait = "0.1"

# Runtime query API (not the compile-time `query!` macros), so the crate builds
# with no database reachable at compile time. `migrate` embeds the SQL files.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "time",
] }

# Server-side password hashing: Argon2id over the client-derived auth key, in
# PHC string form. The client's Argon2id is the brute-force barrier; this keeps
# the stored verifier from being the value transmitted at login.
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["std"] }

rand = "0.8"
sha2 = "0.10"
# HMAC-SHA256 for the F-89 pseudo-salt: an unknown email gets a deterministic,
# pepper-keyed salt so the KDF-params endpoint cannot be used to enumerate
# accounts.
hmac = "0.12"
subtle = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
nemr-crypto = { path = "../nemr-crypto", version = "0.1.0" }
tempfile = "3"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
time = "0.3"
serde_json = "1"
