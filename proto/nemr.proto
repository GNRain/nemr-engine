syntax = "proto3";

// The local control-plane API between the `nemr` CLI and the `nemrd` daemon
// (E-09). Transport is a Unix domain socket; filesystem permissions
// authenticate, so there is nothing auth-related here. The service definition
// is deliberately transport-agnostic — if E-10's remote engine ever happens,
// the transport swaps and this does not.
package nemr.v1;

service Nemr {
  // Version negotiation, first call on every connection. A mismatch is refused
  // cleanly rather than discovered as a confusing failure later (the hash-gate
  // lesson, applied to the daemon protocol).
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);

  rpc Create(CreateRequest) returns (CreateResponse);
  // What a volume size may be on THIS host, and how much room there is for
  // one. Answered from the privileged helper (the program that enforces the
  // bounds) and from statvfs on the volumes directory, so the CLI prompt, the
  // page's slider and the engine cannot hold three different opinions.
  // Provisions nothing.
  rpc SizeLimits(SizeLimitsRequest) returns (SizeLimitsResponse);
  rpc Adopt(AdoptRequest) returns (AdoptResponse);
  rpc Start(StartRequest) returns (StartResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc SwitchAgent(SwitchAgentRequest) returns (SwitchAgentResponse);
  rpc Reconcile(ReconcileRequest) returns (ReconcileResponse);
  rpc Import(ImportRequest) returns (ImportResponse);
  rpc Export(ExportRequest) returns (ExportResponse);
  // Install a project's declared packages (F-118). Explicit only — never run
  // by Start or Import, which sit inside tested no-network guarantees.
  rpc Provision(ProvisionRequest) returns (ProvisionResponse);

  // Daemon->client audit event stream (E-09/NFR-04). A client opens this with
  // its own request id BEFORE running a command; the daemon streams the audit
  // events that command produces — every privileged (helper) operation — so a
  // user can tell inline that a command elevated, without going to the log. A
  // one-way stream, and the channel the lease/sync work will reuse for its own
  // events.
  rpc WatchAudit(WatchAuditRequest) returns (stream AuditEvent);

  // Interactive shell. Bidirectional: the client streams stdin and window
  // resizes, the daemon streams stdout/stderr and the final exit. Bytes flow
  // over the stream — never local paths — so the transport can swap.
  rpc Attach(stream AttachClient) returns (stream AttachServer);

  // Port forwarding (WP-M): reach a server inside a session from the host.
  rpc PortAdd(PortAddRequest) returns (PortListResponse);
  rpc PortRemove(PortRemoveRequest) returns (PortListResponse);
  rpc PortList(PortListRequest) returns (PortListResponse);
}

message HandshakeRequest {
  // The protocol version the CLI was built with.
  uint32 protocol_version = 1;
  // The CLI's own build hash, logged by the daemon for diagnosis (not gating).
  string client_build = 2;
}
message HandshakeResponse {
  uint32 protocol_version = 1;
  string daemon_build = 2;
}

message CreateRequest {
  string name = 1;
  // A volume size: a whole number with an optional unit — "2GB", "1536MB", or
  // a byte count. Kibibyte-based, as the presets always were. Stays a string
  // rather than becoming a uint64 so this field is unchanged on the wire and
  // an older message still parses; what widened is what the engine accepts.
  string size = 2;
  string agent = 3;  // agent id, e.g. "claude-code"
}
message CreateResponse {
  string name = 1;
  string container_id = 2;
  string volume_path = 3;
  string size = 4;
  string agent = 5;
}

// E-23: adopt an existing host directory into a fresh session.
message AdoptRequest {
  string name = 1;
  string size = 2;
  string agent = 3;
  string source_dir = 4;  // an absolute path on the host
  // F-15: measure what the copy WOULD be, provisioning nothing, so the CLI can
  // show it and ask before adopting. The engine is the single writer; the CLI
  // must not reach into it (E-09), so the plan comes through the daemon too.
  bool plan_only = 5;
}
message AdoptResponse {
  string name = 1;
  string container_id = 2;
  string size = 3;
  string agent = 4;
  uint64 files_copied = 5;
  uint64 bytes_copied = 6;
  uint64 history_sessions = 7;
  uint64 history_lines_dropped = 8;
  string source = 9;
  uint64 git_bytes = 10;
  bool is_git_repo = 11;
  // The git directory lives OUTSIDE the folder (a git worktree checkout or a
  // submodule): only the `.git` marker travels, so the session will not be a
  // working repository. Plan-only.
  bool git_dir_external = 12;
  // Lines that did not parse and were not a torn tail: carried over as they
  // are, never dropped. Reported so a summary can say the transcript arrived
  // with damage the host already had.
  uint64 history_lines_corrupt = 13;
}

message SizeLimitsRequest {}
message SizeLimitsResponse {
  uint64 min_bytes = 1;
  uint64 max_bytes = 2;
  // The allocation unit a size is rounded down to.
  uint64 block_bytes = 3;
  // What a create with no size asked for would use.
  uint64 default_bytes = 4;
  // Free space on the filesystem holding the volumes directory, from statvfs —
  // the same call `nemr status` uses, so the two agree.
  uint64 free_bytes = 5;
  string volumes_path = 6;
}

message StartRequest { string name = 1; }
message StartResponse { uint32 supervisor_pid = 1; }

message StopRequest { string name = 1; }
message StopResponse {
  // "graceful" | "killed" | "no_task" | "wedged" (F-78: a task in
  // uninterruptible sleep that SIGKILL could not reap within the window).
  string outcome = 1;
}

message ProvisionRequest { string name = 1; }
message ProvisionResponse {
  // Verified present after the run (dpkg state, not apt's exit status; F-122).
  repeated string installed = 1;
  // Per-package failures, each with the reason in apt/dpkg's own words.
  repeated ProvisionFailure failed = 2;
}
message ProvisionFailure {
  string package = 1;
  string reason = 2;
}

message DeleteRequest { string name = 1; }
message DeleteResponse {}

message ListRequest {}
message ListResponse {
  repeated ProjectStatus projects = 1;
  repeated string untracked_volumes = 2;
}
message ProjectStatus {
  string name = 1;
  string container_id = 2;
  string quota = 3;
  bool running = 4;
  string volume_path = 5;
  bool usage_known = 6;
  uint64 used_bytes = 7;
  double used_percent = 8;
  // The agent id from the container label (WP-K, for `nemr list --json`).
  string agent = 9;
}

message PortSpec {
  string host_ip = 1;
  uint32 host_port = 2;
  uint32 container_port = 3;
  string url = 4;
  // Whether a forward for this declaration is actually bound right now. A
  // declared-but-unbound port must not be shown as a working URL (F-98).
  bool live = 5;
}
message PortAddRequest {
  string name = 1;
  // The user's port argument, verbatim: 8000, 9000:8000, or 0.0.0.0:9000:8000.
  string port = 2;
  bool expose = 3;
}
message PortRemoveRequest {
  string name = 1;
  uint32 host_port = 2;
}
message PortListRequest { string name = 1; }
message PortListResponse { repeated PortSpec ports = 1; }

message StatusRequest { string name = 1; }
message StatusResponse {
  string name = 1;
  string agent = 2;
  string container_id = 19;
  bool running = 3;
  string quota = 4;
  string mount_point = 5;
  string image_file = 6;
  bool image_present = 7;
  bool mounted = 8;
  string loop_device = 9;      // empty if none
  string mounted_image = 10;   // empty if none
  bool usage_known = 11;
  uint64 used_bytes = 12;
  double used_percent = 13;
  string base_image = 14;
  string base_image_digest = 15;  // empty if absent
  string credential_path = 16;    // empty if absent
  int64 credential_modified_secs = 17;  // unix secs, 0 if unknown
  // -1 = not mounted, 0 = wrong volume, 1 = correct (mirrors mount_is_correct).
  int32 mount_check = 18;
  // Declared port forwards (WP-M): "what's my URL" is the question people ask.
  repeated PortSpec ports = 20;
  // When the credential's OAuth token expires, unix secs; 0 if the file
  // carries no expiry (API-key auth, a placeholder) or is absent. Presence
  // is not validity — this is the field that turns "present, last written 0
  // days ago" into "expired 2 days ago".
  int64 credential_expires_at_secs = 21;
  // D-02 (f): the credential is mounted read-write and Claude Code refreshes
  // the access token in-session, so the field above alone no longer decides
  // anything. What does: the refresh token's expiry (0 if undated), whether
  // Claude Code has blanked the file after a dead refresh, and whether a
  // running session still sees a file the host has since replaced (F-12):
  // -1 = cannot tell (not running, or unreadable), 0 = current, 1 = stale.
  int64 credential_refresh_expires_at_secs = 22;
  bool credential_blank = 23;
  int32 credential_stale = 24;
  // The last observed rewrite of the host credential (D-02 (f) observability):
  // when, who could have made it (by elimination — see the daemon's watcher),
  // and what the file parsed as afterwards. Zero/empty if none was observed
  // since the daemon started.
  int64 credential_last_write_secs = 25;
  string credential_last_write_by = 26;
  string credential_last_write_verdict = 27;
  bool credential_last_write_valid = 28;
  // E-21: the credential file is not the engine's placeholder — false on a
  // machine that has never logged in. Additive; the protocol version is
  // unchanged (an old client ignores it, an old daemon leaves it false).
  bool credential_present = 29;
}

message SwitchAgentRequest { string name = 1; string agent = 2; }
message SwitchAgentResponse { string previous = 1; string now = 2; }

message ReconcileRequest {}
message ReconcileResponse {
  repeated string released = 1;
  repeated string not_released = 2;
  repeated string snapshots_removed = 3;
  repeated string orphan_backing_files = 4;
  repeated string stale_forwards = 5;
  repeated string unattributable_forwards = 6;
}

message ImportRequest {
  string bundle_path = 1;
  string name = 2;   // empty = derive from manifest
  string size = 3;   // empty = derive from manifest
}
message ImportResponse {
  string name = 1;
  uint64 members = 2;
  uint64 bytes = 3;
  // Packages the bundle declares (F-118), so the CLI can suggest provisioning.
  // Zero for bundles that predate the feature or projects that installed
  // nothing — proto3 default, so old daemons need no change.
  uint64 declared_packages = 4;
}

message ExportRequest {
  string name = 1;
  string destination = 2;
  bool include_build_artifacts = 3;
}
message ExportResponse {
  string path = 1;
  uint32 schema_version = 2;
  uint64 members = 3;
  uint64 content_bytes = 4;   // uncompressed
  uint64 bundle_bytes = 5;    // on disk
  repeated string unrecognised_fields = 6;  // F-54 schema-drift surface
}

// --- Attach streaming ---

message AttachClient {
  oneof msg {
    AttachStart start = 1;
    bytes stdin = 2;
    AttachResize resize = 3;
    // The client's local input reached EOF (a pipe closed); the shell inside
    // must be told or it never exits.
    bool stdin_eof = 4;
  }
}
message AttachStart {
  string name = 1;
  uint32 rows = 2;
  uint32 cols = 3;
  bool interactive = 4;  // whether the client has a real terminal
}
message AttachResize {
  uint32 rows = 1;
  uint32 cols = 2;
}
message AttachServer {
  oneof msg {
    AttachStarted started = 1;
    bytes stdout = 2;
    bytes stderr = 3;
    int32 exit_code = 4;
    string error = 5;
  }
}
message AttachStarted {}

message WatchAuditRequest {
  // Correlates the stream with the command RPC the client runs next, which
  // carries the same id in its `nemr-request-id` metadata.
  string request_id = 1;
}
message AuditEvent {
  // The first event on every stream: the subscription is live, so the client
  // may now run its command without racing the events it would produce.
  bool ready = 1;
  // The formatted audit line (empty on a ready event).
  string message = 2;
  // True for a privileged (helper) operation — the event a user must see by
  // default. Non-privileged trace lines are shown only under --verbose.
  bool privileged = 3;
  // True for a warning the user must see even though nothing elevated — e.g. a
  // declared port that could not be forwarded (F-98). Without this such
  // failures were logged where only the daemon could see them.
  bool warning = 4;
}
