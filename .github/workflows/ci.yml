name: CI

# Gates the constraints that were previously defended only by memory:
# NFR-01 (no Docker, at any layer, transitively included), lint, and dependency
# licensing/advisories. The host-backed regression suite and the E2E smoke test
# need a provisioned rootless host and run in the `host-tests` job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on any warning. The tree is warnings-clean; keeping it that
  # way is cheaper than a periodic cleanup pass.
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------------------
  # Constraint gates — fast, no host provisioning needed.
  # ---------------------------------------------------------------------------
  docker-free:
    name: constraints — NFR-01 Docker-freeness and the E-11 seam
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      # cargo tree resolves the graph, so the check sees transitive deps.
      - name: Docker-freeness check
        run: ./scripts/check_docker_free.sh

      - name: Base image inputs are pinned (F-74)
        run: ./scripts/check_base_image_pins.sh
      - name: Base image versioning ledger is consistent (F-85)
        run: ./scripts/check_base_image_versioning.sh
      - name: E-09 seam — the CLI must have no direct containerd path
        run: ./scripts/check_cli_seam.sh
      - name: E-11 seam — the open half must not depend on the commercial half
        run: ./scripts/check_seam.sh
      - name: Wait discipline — no script rolls its own readiness loop (F-95)
        run: ./scripts/check_wait_discipline.sh
      - name: The wait helpers behave as documented
        run: ./scripts/test_proc_lib.sh
      - name: Base-image provisioning pulls first and fails closed (F-126)
        run: ./scripts/test_fetch_base_image.sh

  lint:
    name: clippy (warnings denied) + fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Install protoc
        # containerd-client's build script generates gRPC bindings from .proto
        # sources and needs protoc at compile time (PREREQUISITES.md).
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: clippy — engine workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy — privileged helper (separate workspace)
        run: cd deploy/nemr-volume && cargo clippy --all-targets -- -D warnings
      # F-64: this job has been named "clippy + fmt" and has installed rustfmt
      # since it was written, and never ran it. Twenty-six files were
      # unformatted as a result. A job whose name asserts a check it does not
      # perform is the same defect class as F-60 (a green suite that ran
      # nothing) — the signal is real, what it signals is not.
      - name: fmt — engine workspace
        run: cargo fmt --all -- --check
      - name: fmt — privileged helper (separate workspace)
        run: cd deploy/nemr-volume && cargo fmt --all -- --check

  unit-tests:
    name: unit tests (no host required)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Engine + wrapper unit tests
        run: cargo test --workspace --lib
      - name: Privileged helper unit tests
        # Includes the attack-rejection tests (symlinked mount point, symlinked
        # backing file) and the ioctl struct-layout ABI pins.
        run: cd deploy/nemr-volume && cargo test
      - name: Regression tests that need no host
        # NEMR_TEST_UNIT_ONLY is the explicit, narrow opt-out for a machine with
        # no rootless containerd. Host-backed tests return early under it — and
        # a test that returns early is counted as PASSED, so this job would
        # otherwise report "16 passed" while 14 of them did nothing.
        #
        # So the skip count is printed and asserted to be non-zero-but-expected:
        # this job's green means "the host-free tests pass", never "the suite
        # passes". The real coverage claim is the host-tests job below.
        run: |
          set -o pipefail
          total=$(cargo test --test regression -- --list 2>/dev/null | grep -c ': test$')
          # F-65: `output=$(failing-cmd)` under `bash -e` (GitHub's default
          # shell) aborts the step at the assignment, so `status=$?` and every
          # diagnostic below it were unreachable — a failure printed nothing but
          # cargo's exit code. An assignment inside an `if` condition is exempt
          # from -e, so the output survives to be shown.
          if ! output=$(NEMR_TEST_UNIT_ONLY=1 cargo test --test regression -- --nocapture 2>&1); then
            printf '%s\n' "$output" | tail -40
            exit 1
          fi
          printf '%s\n' "$output" | tail -20
          skipped=$(printf '%s\n' "$output" | grep -c 'skipping a host-backed regression test' || true)
          ran=$(( total - skipped ))
          echo "::notice::host-free coverage: $ran of $total regression tests actually executed; $skipped skipped (host required)"
          if [ "$ran" -le 0 ]; then
            echo "no regression test actually executed — this job proves nothing" >&2
            exit 1
          fi

  supply-chain:
    name: licenses + security advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check advisories, licenses, sources, bans
        # Matters for the open-core split (E-11): a copyleft or unvetted
        # dependency is cheap to remove now and expensive later.
        run: |
          cargo deny check
          # The helper is a separate workspace; point it at the same policy
          # rather than letting it fall back to cargo-deny's defaults.
          cargo deny --manifest-path deploy/nemr-volume/Cargo.toml --config deny.toml check

  # ---------------------------------------------------------------------------
  # Commercial sync server (WP-J): identity, index, storage, lease. Needs a real
  # Postgres — D-03 mandates it from day one, because the lease's concurrency
  # semantics (atomic takeover, TTL expiry, two clients racing) are exactly what
  # SQLite cannot give and what these tests exercise. A service container is that
  # Postgres; the tests are not `#[ignore]`d and fail loudly without it.
  # ---------------------------------------------------------------------------
  sync-tests:
    name: sync server tests (Postgres)
    runs-on: ubuntu-24.04
    # No `services:` block: the runner satisfies one by asking Docker to fetch
    # and start a container, which E-17 rules is a dependency we REQUEST and so
    # inside NFR-01. The database comes up under rootless podman instead — via
    # the same script a developer runs locally, so CI and local are one
    # mechanism rather than two that can drift.
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Postgres under rootless podman (E-17)
        run: ./scripts/setup_sync_test_db.sh
      - name: nemr-sync tests against Postgres
        env:
          DATABASE_URL: postgres://nemr:nemr@127.0.0.1:5433/nemr
          # Keep the many per-test pools well under Postgres's default 100.
          NEMR_DB_MAX_CONN: "5"
        # -p nemr-sync builds only the commercial crate and its deps (no
        # containerd-client, so no protoc needed here). Runs lib + integration.
        run: cargo test -p nemr-sync
      - name: nemr-cloud tests against the in-process server (WP-K)
        env:
          DATABASE_URL: postgres://nemr:nemr@127.0.0.1:5433/nemr
          NEMR_DB_MAX_CONN: "5"
        # The client binary driven as real processes — including the detached
        # lease-heartbeat holder and the stale-machine lockout proof. The
        # engine is a stub here; the real-engine flow is
        # scripts/sync_acceptance.sh in the host job.
        run: cargo test -p nemr-cloud

  # ---------------------------------------------------------------------------
  # Host-backed: needs rootless containerd, the privileged helper, and the base
  # image. Runs on a clean Ubuntu runner, provisioned by the same scripts a
  # developer uses — which is what makes AC-7.1 ("clean host") a tested claim.
  # ---------------------------------------------------------------------------
  host-tests:
    name: regression suite + E2E smoke (clean Ubuntu runner)
    runs-on: ubuntu-24.04
    # Provisioning rootless containerd on a runner is the long pole; keep it off
    # the critical path for a lint typo but never let it be silently skipped.
    needs: [docker-free, lint, unit-tests]
    # No `services:` block here either, for two independent reasons. E-17: the
    # runner satisfies one through Docker, which is a dependency we request.
    # F-93: it would not have survived anyway — a service container is backed
    # by the system containerd, and ci_provision_host.sh disables
    # containerd.service under PRIV-01, so the database died mid-job, after
    # provisioning had already reported success. Rootless podman answers both:
    # daemonless, no containerd, and the same thing developers run locally.
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Provision the host (rootless containerd, helper, base image)
        run: ./scripts/ci_provision_host.sh
      - name: Install the privileged helper
        run: sudo ./scripts/setup_test_host.sh
      - name: Install the engine
        # NOT `cargo install --path .` (F-62): it rebuilds in its own target
        # directory and emits a binary that cannot equal target/release/nemr, so
        # the installed-matches-source gate could never pass here. This builds
        # once and copies the artifact, which is what makes "verified against the
        # installed artifacts" a checkable claim rather than a hope.
        run: ./scripts/install_engine.sh
      - name: Base image builds reproducibly (F-74)
        # Runs here because this job already has a rootless buildkitd and the
        # base image; it is the check that was believed to exist and did not.
        run: ./scripts/check_base_image_reproducible.sh
      - name: Regression suite (serial; hash-gated against the installed helper)
        # Count assertion: every test that exists must run, and none may skip.
        # `cargo test` exits 0 having run ZERO tests, so exit status alone is not
        # evidence that anything was verified.
        run: |
          set -o pipefail
          export CONTAINERD_ADDRESS="$XDG_RUNTIME_DIR/containerd/containerd.sock"
          total=$(cargo test --test regression -- --list 2>/dev/null | grep -c ': test$')
          # F-65: see the unit job — the assignment must sit inside an `if`
          # condition or `bash -e` kills the step before the diagnostic runs.
          if ! output=$(cargo test --test regression -- --test-threads=1 --nocapture 2>&1); then
            printf '%s\n' "$output" | grep -E '^test result:' || true
            # Print the FAILURES section, not just the tail. `tail -40` was
            # enough at 17 tests and silently truncated the panic at 36 — the
            # F-65 class again: the diagnostic existed and did not reach anyone.
            printf '%s\n' "$output" | sed -n '/^failures:/,$p' || true
            printf '%s\n' "$output" | grep -B2 -A15 'panicked at' || true
            printf '%s\n' "$output" | tail -40
            exit 1
          fi
          printf '%s\n' "$output" | grep -E '^test result:' || true
          passed=$(printf '%s\n' "$output" | sed -n 's/.*test result: ok\. \([0-9]*\) passed.*/\1/p' | head -1)
          skipped=$(printf '%s\n' "$output" | grep -c 'skipping a host-backed regression test' || true)
          if [ "${passed:-0}" -ne "${total:-0}" ] || [ "${skipped:-0}" -ne 0 ]; then
            echo "partial run: ${passed:-0}/${total:-0} ran, ${skipped:-0} skipped — not a pass" >&2
            exit 1
          fi
          echo "all ${total} regression tests ran, none skipped"
      - name: E2E smoke test
        # NEMR_SKIP_API: CI has no Anthropic credentials, so the API round-trip
        # is skipped here. It is NOT skipped in the developer run, and the smoke
        # test states which mode it ran in — a CI pass is therefore a weaker
        # claim than a local pass, deliberately and visibly.
        run: |
          export CONTAINERD_ADDRESS="$XDG_RUNTIME_DIR/containerd/containerd.sock"
          NEMR_SKIP_API=1 ./scripts/e2e_smoke_test.sh
      - name: Postgres under rootless podman (E-17, F-93)
        # AFTER host provisioning, which disables the system containerd. Podman
        # is daemonless and does not use it, so this survives where a service
        # container did not.
        run: ./scripts/setup_sync_test_db.sh
      - name: Port acceptance — reach a session's server from the host (WP-M)
        # The blocker this closed: a dev server inside a session was
        # unreachable. Asserts on host-observable state (curl, ss), with a
        # control proving the port was refused before the forward existed.
        run: |
          export CONTAINERD_ADDRESS="$XDG_RUNTIME_DIR/containerd/containerd.sock"
          ./scripts/port_acceptance.sh
      - name: NET-02 acceptance — two sessions, same internal port (WP-N)
        # The thing NET-01 made impossible. Asserts on host-observable state,
        # with a control proving the NAT is what provides egress. NEMR_SKIP_API
        # omits only the live API call; the footer states which mode ran.
        run: |
          export CONTAINERD_ADDRESS="$XDG_RUNTIME_DIR/containerd/containerd.sock"
          NEMR_SKIP_API=1 ./scripts/netns_acceptance.sh
      - name: Packages acceptance — a session's tools travel with it (F-118)
        # Install jq in a session, export, import CLEAN, prove jq absent (the
        # pristine-import control), provision, prove jq runs. Sessions have
        # egress in CI (NET-02's NAT, proven by the netns acceptance), so the
        # apt install is real here, not mocked.
        run: |
          export CONTAINERD_ADDRESS="$XDG_RUNTIME_DIR/containerd/containerd.sock"
          ./scripts/packages_acceptance.sh

      - name: Sync acceptance — the product flow (WP-K)
        # Engine + server, together: register, create, work, push, DELETE THE
        # PROJECT, pull, continue. NEMR_SKIP_API asserts transcript
        # byte-fidelity (no credential on a runner); the full continuity claim
        # is the developer run, and the script's footer states which ran.
        env:
          DATABASE_URL: postgres://nemr:nemr@127.0.0.1:5433/nemr
        run: |
          export CONTAINERD_ADDRESS="$XDG_RUNTIME_DIR/containerd/containerd.sock"
          NEMR_SKIP_API=1 ./scripts/sync_acceptance.sh

      - name: What the host looked like when it failed
        # Only on failure, and only reading. An intermittent failure in this job
        # cost a full CI round-trip to a question the daemon log already
        # answered — it just was not collected. The engine's own log is the one
        # place the daemon's side of a failed command is recorded, and a
        # scripted assertion cannot print what it never had.
        if: failure()
        run: |
          export CONTAINERD_ADDRESS="$XDG_RUNTIME_DIR/containerd/containerd.sock"
          dump() { printf '\n===== %s =====\n' "$1"; shift; "$@" 2>&1 | tail -120 || echo "(unavailable)"; }
          log="${XDG_STATE_HOME:-$HOME/.local/state}/nemr/nemrd.log"
          printf '\n===== nemrd.log (last 200 lines of %s) =====\n' "$log"
          if [ -s "$log" ]; then tail -200 "$log"
          elif [ -e "$log" ]; then echo "(the file exists and is EMPTY)"
          else echo "(no such file — the daemon never wrote one)"; fi
          dump "nemr list"            nemr list
          dump "nemrd processes"      pgrep -a nemrd
          dump "containerd containers" ctr -n default containers list
          dump "containerd tasks"     ctr -n default tasks list
          rk="$(cat "$XDG_RUNTIME_DIR/containerd-rootless/child_pid" 2>/dev/null || true)"
          if [ -n "$rk" ]; then
            dump "rootlesskit links" nsenter -t "$rk" -U -n --preserve-credentials -- ip -brief link show
            dump "rootlesskit NAT"   nsenter -t "$rk" -U -n --preserve-credentials -- iptables -w 5 -t nat -S POSTROUTING
          else
            echo "(rootlesskit child_pid unreadable — cannot inspect its namespace)"
          fi
          dump "host routes"          ip -4 route show table all
