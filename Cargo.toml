[workspace]
# `crates/nemr-storage` is the COMMERCIAL side of E-11 and is a workspace member
# only so it builds and tests here. `nemr-engine` must NOT depend on it — see
# scripts/check_seam.sh, which enforces the direction.
#
# The wrapper layer (SPEC §3.2) is its own crate so the GUI and the resolved
# E-09 daemon can consume it without pulling in the engine. deploy/nemr-volume
# has its own [workspace] and stays a separate privilege domain.
members = ["crates/nemr-containerd", "crates/nemr-daemon-api", "crates/nemr-style", "crates/nemr-storage", "crates/nemr-crypto", "crates/nemr-sync", "crates/nemr-cloud"]

[package]
name = "nemr-engine"
version = "0.1.0"
edition = "2021"
description = "Nemr Phase 1 — core container engine (containerd/runc, no Docker)"
exclude = ["deploy"]
# Not published to crates.io: this is a workspace-internal crate. Also what lets
# cargo-deny skip the licence check for it (deny.toml `private`), rather than
# asserting a licence the Product Owner has not chosen yet (E-11).
publish = false

# Library crate: product logic in src/engine/, re-exporting the wrapper crate as
# `containerd` so the layering rule (SPEC §3.2) reads unchanged at call sites.
[lib]
name = "nemr_engine"
path = "src/lib.rs"

# CLI entrypoint — sole user interface for Phase 1 (Section 1.3, item 6).
[[bin]]
name = "nemr"
path = "src/bin/nemr.rs"

[dependencies]
# The shared voice of the command line. Open, tiny, no dependencies of its own
# — the commercial half depends on it too, which is why it is its own crate.
nemr-style = { path = "crates/nemr-style", version = "0.1.0" }
# The engine depends on the wrapper crate, never on containerd-client directly
# (SPEC §3.2). The connectivity baselines that DO use containerd-client directly
# moved into the wrapper crate's own bins.
nemr-containerd = { path = "crates/nemr-containerd", version = "0.1.0" }
# The daemon's API — proto, stubs, socket path, client — as its own open crate
# (the E-11 seam of 2026-09-06), so a client of the daemon need not link this.
nemr-daemon-api = { path = "crates/nemr-daemon-api", version = "0.1.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
anyhow = "1"
serde_json = "1.0.151"
sha2 = "0.11.0"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
libc = "0.2.189"
# The engine's error taxonomy (E-12). thiserror only generates Display/Error
# impls — no runtime, no dependencies of consequence — and it is what lets the
# taxonomy carry structured fields instead of formatted strings.
thiserror = "2"
# Structured lifecycle logging (B3). `tracing` rather than `log` because spans —
# not just events — are what make a multi-step operation like create/start
# legible in a log: every event inside a span carries the project name and the
# step it happened in, without threading that through every call site.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tar = "0.4.46"
zstd = "0.13.3"
# Interactive prompts for `nemr create` (WP-H). Only ever runs when stdin is a
# TTY and no flag supplied the value; the never-hang logic lives in
# src/interactive.rs, not here. Minimal features: no fuzzy-search, no history.
dialoguer = { version = "0.11", default-features = false }
# The nemrd daemon (E-09): gRPC over a Unix domain socket. Pinned to the same
# 0.14 line containerd-client re-exports, so cargo unifies to one tonic rather
# than resolving a second, incompatible version (the M1 lesson).
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio-stream = "0.1"
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"

