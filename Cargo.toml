[workspace]
# The wrapper layer (SPEC §3.2) is its own crate so the GUI and the resolved
# E-09 daemon can consume it without pulling in the engine. deploy/nemr-volume
# has its own [workspace] and stays a separate privilege domain.
members = ["crates/nemr-containerd"]

[package]
name = "nemr-engine"
version = "0.1.0"
edition = "2021"
description = "Nemr Phase 1 — core container engine (containerd/runc, no Docker)"
exclude = ["deploy"]

# Library crate: product logic in src/engine/, re-exporting the wrapper crate as
# `containerd` so the layering rule (SPEC §3.2) reads unchanged at call sites.
[lib]
name = "nemr_engine"
path = "src/lib.rs"

# CLI entrypoint — sole user interface for Phase 1 (Section 1.3, item 6).
[[bin]]
name = "nemr"
path = "src/bin/nemr.rs"

[dependencies]
# The engine depends on the wrapper crate, never on containerd-client directly
# (SPEC §3.2). The connectivity baselines that DO use containerd-client directly
# moved into the wrapper crate's own bins.
nemr-containerd = { path = "crates/nemr-containerd" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
anyhow = "1"
serde_json = "1.0.151"
sha2 = "0.11.0"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
libc = "0.2.189"
