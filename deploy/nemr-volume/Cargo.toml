[package]
name = "nemr-volume"
version = "0.1.0"
edition = "2021"
description = "Root-owned privileged helper for Nemr volume provisioning (PRIV-03)"

# Standalone workspace on purpose. This crate is installed root-owned at a
# fixed path and runs under sudo; it is a different privilege domain from the
# engine and must not inherit the engine's dependency graph. An empty
# [workspace] table stops cargo from treating it as a member of the parent.
[workspace]

# One dependency, deliberately: `libc`, the platform ABI crate maintained by
# the Rust project itself. It is the single exception to the zero-dependency
# stance, and it is not a real supply-chain concession — `libc` is the binding
# to the C library every Rust program already links, not third-party logic.
#
# It is here because closing the TOCTOU that let a caller redirect a privileged
# `mount`/`chown` off the managed directory (a demonstrated local root
# escalation) requires `openat`/`O_NOFOLLOW`/`fchown`/`flock`, none of which
# `std` exposes. Correctness against a root escalation outranks a dependency
# count. See src/safe.rs.
[dependencies]
libc = "0.2"

[profile.release]
strip = true
