# cgroup v2 controller delegation for rootless containerd (SPEC §3.3).
#
# memory and pids are delegated by default; cpu, cpuset and io are not, and
# without cpu a rootless task fails to start with
# "cpu.weight: no such file or directory".
#
# Installed to /etc/systemd/system/user@.service.d/delegate.conf. Takes effect
# only when the user manager restarts, which in practice means a reboot —
# scripts/setup_host.sh surfaces that rather than hiding it.
[Service]
Delegate=cpu cpuset io memory pids
